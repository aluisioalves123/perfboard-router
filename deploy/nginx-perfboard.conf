# Perfboard Router — perfboard.SEUDOMINIO.com.br
#
# Troque SEUDOMINIO pelo seu domínio antes de usar (aparece uma vez, no
# server_name; o certbot reescreve o resto sozinho).
#
# O nginx serve os arquivos estáticos direto (rápido e barato) e só encaminha
# /api/ para o gunicorn. Coloque em /etc/nginx/sites-available/ e crie o link
# em sites-enabled/.
#
# O bloco de TLS abaixo é o que o certbot escreve sozinho. Suba primeiro só com
# a porta 80, rode o certbot, e ele reescreve este arquivo.

upstream perfboard {
    server unix:/run/perfboard/perfboard.sock fail_timeout=0;
}

# Limita quem martela a API. A zona guarda ~16 mil IPs em 1 MB.
limit_req_zone $binary_remote_addr zone=perfboard_api:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perfboard_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name perfboard.SEUDOMINIO.com.br;

    # o certbot injeta o redirect para https aqui
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /opt/perfboard/web;
    index index.html;

    access_log /var/log/nginx/perfboard.access.log;
    error_log  /var/log/nginx/perfboard.error.log;

    # netlist é texto e comprime muito bem
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ---- estáticos ----
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- API ----
    location /api/ {
        limit_req zone=perfboard_api burst=10 nodelay;
        limit_conn perfboard_conn 4;

        proxy_pass http://perfboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # roteamento pode levar alguns segundos; o wsgi.py limita a carga
        proxy_connect_timeout 5s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;
        proxy_buffering off;
    }

    location = /api/health {
        proxy_pass http://perfboard;
        access_log off;
    }
}
